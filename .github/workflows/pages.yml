name: Deploy TRIP QUEST to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static site from packaged release
        run: |
          rm -rf _site /tmp/tripquest
          mkdir -p _site /tmp/tripquest/unpacked
          cat deploy/part-*.b64 | base64 -d > /tmp/tripquest/site.zip
          unzip -q /tmp/tripquest/site.zip -d /tmp/tripquest/unpacked || true
          test -f /tmp/tripquest/unpacked/TRIP-QUEST-Mobile-v0.7-Pages/index.html
          test -f /tmp/tripquest/unpacked/TRIP-QUEST-Mobile-v0.7-Pages/app.js
          test -f /tmp/tripquest/unpacked/TRIP-QUEST-Mobile-v0.7-Pages/styles.css
          cp -a /tmp/tripquest/unpacked/TRIP-QUEST-Mobile-v0.7-Pages/. _site/
          mkdir -p _site/icons
          python3 - <<'PY'
          import os, struct, zlib

          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)

          def make_png(path, width, height, rgb=(12, 17, 23)):
              row = b"\x00" + bytes(rgb) * width
              raw = row * height
              png = b"\x89PNG\r\n\x1a\n"
              png += chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0))
              png += chunk(b"IDAT", zlib.compress(raw, 9))
              png += chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(png)

          make_png("_site/icons/icon-192.png", 192, 192)
          make_png("_site/icons/icon-512.png", 512, 512)
          make_png("_site/icons/maskable-512.png", 512, 512)
          make_png("_site/icons/apple-touch-icon.png", 180, 180)
          PY
          rm -rf _site/.github
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
