name: TRIP QUEST CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript modules
        run: |
          node --check site-src/app.js
          node --check site-src/app-chrome.js
          node --check site-src/sw.js
          find site-src/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run smoke tests
        run: npm test
