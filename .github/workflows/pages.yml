name: Deploy TRIP QUEST to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static site from packaged release
        run: |
          rm -rf _site /tmp/tripquest
          mkdir -p _site /tmp/tripquest/unpacked
          cat deploy/part-*.b64 | base64 -d > /tmp/tripquest/site.zip
          unzip -q /tmp/tripquest/site.zip -d /tmp/tripquest/unpacked || true
          test -f /tmp/tripquest/unpacked/TRIP-QUEST-Mobile-v0.7-Pages/index.html
          test -f /tmp/tripquest/unpacked/TRIP-QUEST-Mobile-v0.7-Pages/app.js
          test -f /tmp/tripquest/unpacked/TRIP-QUEST-Mobile-v0.7-Pages/styles.css
          cp -a /tmp/tripquest/unpacked/TRIP-QUEST-Mobile-v0.7-Pages/. _site/
          mkdir -p site-src
          cp /tmp/tripquest/unpacked/TRIP-QUEST-Mobile-v0.7-Pages/index.html site-src/index.html
          cp /tmp/tripquest/unpacked/TRIP-QUEST-Mobile-v0.7-Pages/app.js site-src/app.js
          cp /tmp/tripquest/unpacked/TRIP-QUEST-Mobile-v0.7-Pages/styles.css site-src/styles.css
          cp /tmp/tripquest/unpacked/TRIP-QUEST-Mobile-v0.7-Pages/manifest.webmanifest site-src/manifest.webmanifest 2>/dev/null || true
          cp /tmp/tripquest/unpacked/TRIP-QUEST-Mobile-v0.7-Pages/sw.js site-src/sw.js 2>/dev/null || true
          mkdir -p _site/icons
          python3 - <<'PY'
          import os, struct, zlib

          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)

          def make_png(path, width, height, rgb=(12, 17, 23)):
              row = b"\x00" + bytes(rgb) * width
              raw = row * height
              png = b"\x89PNG\r\n\x1a\n"
              png += chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0))
              png += chunk(b"IDAT", zlib.compress(raw, 9))
              png += chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(png)

          make_png("_site/icons/icon-192.png", 192, 192)
          make_png("_site/icons/icon-512.png", 512, 512)
          make_png("_site/icons/maskable-512.png", 512, 512)
          make_png("_site/icons/apple-touch-icon.png", 180, 180)
          PY
          rm -rf _site/.github
          touch _site/.nojekyll
          if [ ! -f site/app.js ]; then
            mkdir -p site
            cp -a _site/. site/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site
            git commit -m "Extract deploy source for maintainable updates" || true
            git push || true
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path("_site/index.html")
          html = p.read_text(encoding="utf-8")
          tag = '<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">'
          if 'name="robots"' not in html:
              html = html.replace("<head>", "<head>\n  " + tag, 1)
              p.write_text(html, encoding="utf-8")
          Path("_site/robots.txt").write_text("User-agent: *\nDisallow: /\n", encoding="utf-8")
          PY

      - name: Save editable source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-src
          if ! git diff --cached --quiet; then
            git commit -m "Extract editable site source [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
