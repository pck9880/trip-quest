name: TRIP QUEST Search QA
on:
  push:
    branches: [main]
    paths:
      - 'site-src/test/js/services/**'
      - 'site-src/test/js/controllers/search-controller.js'
      - 'site-src/test/index.html'
      - 'site-src/test/auth.js'
      - 'site-src/test/sw.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/search-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete app and search regression suite
        run: npm test
